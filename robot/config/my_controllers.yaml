controller_manager:
  ros__parameters:
    update_rate: 100 
    #30?
    # use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_link

    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.408 # corrección sobre giro; anterior medido: 0.407
    wheel_radius: 0.056 # antes 0.055

    use_stamped_vel: false

    # open_loop: false    

    # wheels_per_side: x
    # wheel_separation_multiplier: x
    # left_wheel_radius_multiplier: x
    # right_wheel_radius_multiplier: x

    # odom_frame_id: x
    # pose_covariance_diagonal: x
    # twist_covariance_diagonal: x
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    # open_loop: x
    enable_odom_tf: false

    # cmd_vel_timeout: x
    # publish_limited_velocity: x
    # velocity_rolling_window_size: x
    

    # ── LÍMITES DE SEGURIDAD ──────────────────────────────────────────────
    # Red de seguridad para cualquier fuente de cmd_vel (Nav2, teleop, scripts):
    # sin esto, un comando anómalo llegaba sin recorte a los motores (los min/max
    # ±10 del xacro no se aplican en Humble). Con margen sobre Nav2 (DWB: 0.18 m/s,
    # 0.56 rad/s, acc 1.5 / 1.9) para no interferir con la navegación normal.
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.35
    linear.x.min_velocity: -0.35
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 2.0
    linear.x.min_acceleration: -2.0
    linear.x.has_jerk_limits: false

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0
    angular.z.has_jerk_limits: false




